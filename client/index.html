<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Collaborative Canvas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Collaborative Canvas</h1>
      <div>Online: <span id="userCount">0</span></div>
    </header>

    <div class="toolbar">
      <button id="brush" class="active">Brush</button>
      <button id="eraser">Eraser</button>
      <input id="color" type="color" value="#000000" />
      <input id="size" type="range" min="1" max="40" value="4" />
      <button id="undo">Undo</button>
      <button id="redo">Redo</button>
      <button id="clear">Clear</button>
    </div>

    <div class="canvas-area">
      <div class="canvas-wrapper">
        <canvas id="canvas-static"></canvas>
        <canvas id="canvas-live"></canvas>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
